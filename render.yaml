# Render Blueprint — deploys the backend as a native Python web service
# (no Docker). Push this repo to GitHub, then in Render: New -> Blueprint,
# point it at the repo, and Render reads this file automatically.
#
# The database itself is NOT defined here -- we use a free Neon Postgres
# instance instead of Render's own Postgres, so just paste your Neon
# connection string into DATABASE_URL after the service is created.

services:
  - type: web
    name: rag-backend
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATABASE_URL
        sync: false          # paste your Neon connection string in the Render dashboard
      - key: SECRET_KEY
        generateValue: true  # Render auto-generates a secure random secret
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: "1440"
      - key: ALGORITHM
        value: "HS256"
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_USERNAME
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: LLM_API_BASE
        value: "https://api.groq.com/openai/v1"
      - key: LLM_API_KEY
        sync: false          # paste your free Groq API key in the Render dashboard
      - key: LLM_MODEL
        value: "llama-3.1-8b-instant"
      - key: EMBEDDING_MODEL
        value: "BAAI/bge-small-en-v1.5"
      - key: EMBEDDING_DIM
        value: "384"
      - key: RERANK_MODEL
        value: "BAAI/bge-reranker-base"
      - key: UPLOAD_DIR
        value: "./uploads"
      - key: MAX_UPLOAD_MB
        value: "25"
      - key: TOP_K_CHUNKS
        value: "6"
      - key: ALLOWED_ORIGINS
        value: "*"
